# Config kitty commune, chargée par dotf-hook.conf (puis ~/.config/dotf/kitty.conf, prioritaire).

# Police : Hasklig avec icônes (module nerd-fonts) ; ligatures, sauf sous le curseur.
font_family Hasklug Nerd Font Mono
font_size 11
disable_ligatures cursor

# Couleurs : palette Catppuccin envoyée par le shell (dotf theme). Fond mocha en attendant le premier prompt.
background #1e1e2e
foreground #cdd6f4

# Intégration shell de kitty, sans le curseur ni le titre : déjà gérés par dotf.
shell_integration no-cursor no-title

# Mises à jour par « dotf update ».
update_check_interval 0

scrollback_lines 10000
enable_audio_bell no
