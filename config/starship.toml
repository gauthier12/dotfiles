# Config starship (https://starship.rs/config/).
# HOST_COLOR est remplacé par la couleur de la machine (shell/rc.d/85-host-color.sh).
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

# ❯ vert si la dernière commande a réussi, rouge sinon.

[time]
disabled = false
format = "[$time]($style) "

[username]
show_always = true
format = "[$user]($style)@"

[hostname]
ssh_only = false
style = "bold HOST_COLOR"
format = "[$hostname]($style) "
