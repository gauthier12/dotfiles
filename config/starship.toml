# Config starship (https://starship.rs/config/).
# Icônes : police Nerd Font (module nerd-fonts sur le poste, réglée dans le terminal), notées \uXXXX.
# HOST_COLOR est remplacé par la couleur de la machine (shell/rc.d/85-host-color.sh).
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$time\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$status\
$line_break\
$character"""

# À droite de la première ligne : durée (commandes longues), puis coche ou croix et code retour.
[fill]
symbol = " "

# ❯ vert si la dernière commande a réussi, rouge sinon.

[time]
disabled = false
format = "[\ue383 $time]($style) " # horloge

[username]
show_always = true
format = "[$user]($style) "

[hostname]
ssh_only = false
ssh_symbol = "\U000f08c0 " # ssh
style = "bold HOST_COLOR"
format = "[$ssh_symbol\U000f01c5 $hostname]($style) " # ordinateur

[directory]
read_only = " \U000f033e" # cadenas
format = "[\ue613 $path]($style)[$read_only]($read_only_style) " # dossier

# Après chaque commande : coche verte si elle a réussi, croix rouge et code retour sinon.
[status]
disabled = false
success_symbol = "[\uf00c](bold green)"
symbol = "[\uf00d $status](bold red)"
format = "$symbol"
