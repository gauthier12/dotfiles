# Config starship (https://starship.rs/config/).
# Icônes : police Nerd Font (module nerd-fonts sur le poste, réglée dans le terminal), notées \uXXXX.
# Remplacés par shell/rc.d/85-host-color.sh : HOST_COLOR (couleur de la machine) et HOST_ICON (ordinateur, ou serveur
# en ssh), LINE_COLOR (green ou red), PALETTE (catppuccin_<thème de « dotf theme »>, ou ansi sans le module catppuccin).
"$schema" = "https://starship.rs/config-schema.json"

palette = "PALETTE"
add_newline = false

format = """
[──](LINE_COLOR)\
$time\
$fill\
$cmd_duration\
$status\
[──](LINE_COLOR)\
$line_break\
$username\
$hostname\
[](fg:HOST_COLOR bg:blue)\
$python\
$directory\
($git_branch$git_commit$git_state$git_status[](fg:mauve))\
$line_break\
$character"""

# Première ligne : trait sur toute la largeur, vert si la dernière commande a réussi, rouge sinon.
# Dessus : heure, durée (commandes longues), coche ou croix et code retour.
[fill]
symbol = "─"
style = "LINE_COLOR"

[time]
disabled = false
style = "LINE_COLOR"
format = "[  $time ]($style)" # horloge

[cmd_duration]
format = "[ $duration]($style)"

[status]
disabled = false
success_symbol = "[](bold green)"
symbol = "[ $status](bold red)"
format = " $symbol "

# Deuxième ligne, en blocs (style powerline) : login et machine, dossier (et venv Python actif), git.
# Le dossier ferme la chaîne hors d'un dépôt git (format), ou la passe au bloc git (repo_root_format).
[username]
show_always = true
style_user = "bold fg:crust bg:HOST_COLOR"
style_root = "bold fg:crust bg:red"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "bold fg:crust bg:HOST_COLOR"
format = "[HOST_ICON $hostname ]($style)"

[python]
detect_extensions = []
detect_files = []
detect_folders = []
symbol = " "
style = "fg:crust bg:blue"
format = "[ $symbol$virtualenv( $version)]($style)"

[directory]
style = "fg:crust bg:blue"
before_repo_root_style = "fg:crust bg:blue"
repo_root_style = "bold fg:crust bg:blue"
read_only = "\U000f033e" # cadenas
read_only_style = "fg:red bg:blue"
format = "[  $path ]($style)([$read_only ]($read_only_style))[](fg:blue)" # dossier
repo_root_format = "[  $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)([$read_only ]($read_only_style))[](fg:blue bg:mauve)"

[git_branch]
style = "fg:crust bg:mauve"
format = "[ $symbol$branch ]($style)"

[git_commit]
style = "fg:crust bg:mauve"
format = "[ \\($hash$tag\\) ]($style)"

[git_state]
style = "bold fg:crust bg:mauve"
format = "[\\($state( $progress_current/$progress_total)\\) ]($style)"

[git_status]
style = "bold fg:crust bg:mauve"
format = "([$all_status$ahead_behind ]($style))"

# Sans le module catppuccin : couleurs du terminal.
[palettes.ansi]
crust = "black"
blue = "blue"
mauve = "purple"
red = "red"
green = "green"
rosewater = "red"
flamingo = "red"
pink = "purple"
maroon = "red"
peach = "yellow"
yellow = "yellow"
teal = "cyan"
sky = "cyan"
