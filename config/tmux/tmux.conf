# Config tmux commune, chargée depuis ~/.tmux.conf par dotf (puis ~/.config/dotf/tmux.conf, prioritaire).

# Couleurs 24 bits vers le terminal (Windows Terminal, kitty… s'annoncent xterm-256color) :
# la palette Catppuccin envoyée par le shell de chaque volet est rendue exactement.
set -as terminal-features ',xterm-256color:RGB'

# Molette : défile l'historique du volet (et non celui du shell) ; revenu en bas, on sort du défilement.
# Maj + clic : sélection et collage par le terminal, comme dans vim.
set -g mouse on
set -g history-limit 50000
